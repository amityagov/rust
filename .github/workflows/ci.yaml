name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p server --features tls-server --all-targets -- -D warnings
      - name: Tests
        env:
          # The lock tests run against this scratch database; without it they are skipped.
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          cargo test --workspace
          cargo test -p server --features tls-server
      - name: All features of lib
        run: cargo check -p lib --features "full,tls-server,currency-sqlx"
