[package]
name = "locks"
version = "0.4.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.8.6", features = ["postgres"], default-features = false }
anyhow = { version = "1.0.100", default-features = false }
tokio = { version = "1", features = ["time", "sync", "rt"], default-features = false }
tracing = { version = "0", default-features = false }
uuid = { version = "1", features = ["v4"], default-features = false }

[dev-dependencies]
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio"], default-features = false }
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
