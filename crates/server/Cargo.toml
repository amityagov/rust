[package]
name = "server"
version = "0.1.0"
edition = "2024"

[features]
default = []
tls-server = ["dep:axum-server", "dep:rustls", "dep:rustls-pki-types"]

[dependencies]
tokio = { version = "1", default-features = false }
axum = { version = "0.8.6", features = ["json", "tokio", "tracing", "ws", "http1", "http2"], default-features = false }
axum-extra = { version = "0.10.3", features = ["typed-header"], default-features = false }
anyhow = { version = "1.0.100" }
tracing = { version = "0", default-features = false }
jsonwebtoken = { version = "10.1.0", features = ["rust_crypto", "use_pem"], default-features = false }
base64 = { version = "0.22.1", default-features = false }
serde = { version = "1", features = ["derive"], default-features = false }
headers = { version = "0.4.1", default-features = false }

signal = { path = "../signal" }

# TLS dependencies (only used when tls-server feature is enabled)
axum-server = { version = "0.8", optional = true, features = ["tls-rustls"] }
rustls = { version = "0.23", optional = true }
rustls-pki-types = { version = "1", optional = true }